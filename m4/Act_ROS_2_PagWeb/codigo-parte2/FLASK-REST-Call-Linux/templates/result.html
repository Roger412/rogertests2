<!DOCTYPE html>
<html>
  <head>
    <title>API Call Result</title>
    <script>
      function updateResult() {
        fetch('/api/result')
          .then(response => response.text())
          .then(result => {
            document.getElementById('result').textContent = result;
          });
      }
      setInterval(updateResult, 500);
    </script>
  </head>
  <body>
    <h1>API Call Result</h1>
    <p id="result"></p>
  </body>
</html>
